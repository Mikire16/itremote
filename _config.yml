# Конфигурация для GitHub Pages
baseurl: ""

# Позволяет использовать относительные пути в ссылках
permalink: pretty

# Отключаем плагины, которые могут конфликтовать с нашим приложением
plugins: []

# Исключаем файлы, которые не должны обрабатываться Jekyll
exclude:
  - README.md
  - LICENSE
  - .gitignore 